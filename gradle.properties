wireguardVersionCode=519
wireguardVersionName=1.0.20260315
wireguardPackageName=com.wireguard.android

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
org.gradle.caching=true

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# Turn off AP discovery in compile path to enable compile avoidance
kapt.include.compile.classpath=false

# PATCHED (Expressive redesign): compileSdk is pinned to the newest stable
# platform (37.2) rather than the newest one AGP has been tested against
# (37.1 as of AGP 9.3.2), because Material 3 Expressive needs it. Revisit
# when AGP catches up: drop this line and the warning should stay silent.
android.suppressUnsupportedCompileSdk=37.2
